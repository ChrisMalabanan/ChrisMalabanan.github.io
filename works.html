<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Works</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark glass fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="images/logo.jpg" width="70" height="70" alt="Logo" class="rounded-circle me-2">
                <span class="fs-4">My Portfolio</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav nav-underline gap-4 me-3">
                    <li class="nav-item"><a class="nav-link" href="index.html">About Me</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Works</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacts.html">Contacts</a></li>
                </ul>
                <button id="modeToggle" class="btn btn-outline-light btn-sm">Dark</button>
            </div>
        </div>
    </nav>

    <div class="navbar-spacer"></div>

    <main class="flex-grow-1">
        <div class="container py-5">

            <div class="glass rounded-4 p-5 text-center text-white">
                <h2 class="name-text mb-3">My Works</h2>
                <p class="greet-text mb-5">Here are some of my projects and works:</p>

                <div class="row row-cols-1 row-cols-md-2 g-5 justify-content-center" id="worksGrid">
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const modeToggle = document.getElementById('modeToggle');

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.body.classList.toggle('dark-mode', isDark);
            if (modeToggle) {
                modeToggle.textContent = isDark ? 'Light' : 'Dark';
                modeToggle.classList.toggle('btn-outline-light', !isDark);
                modeToggle.classList.toggle('btn-outline-dark', isDark);
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);

        if (modeToggle) {
            modeToggle.addEventListener('click', () => {
                const newTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
                localStorage.setItem('theme', newTheme);
                applyTheme(newTheme);
            });
        }

        const works = [
            {
                title: "Techno40Pro",
                backgroundImage: "Techno.png",
                description: "A durable and stylish smartphone featuring a high-performance MediaTek Dimensity 7300 processor, a 50MP main camera, and a 5200mAh battery with 45W charging.",
                links: [
                    { href: "https://chrismalabanan.github.io/Techno40Pro/", label: "View" },
                    { href: "https://github.com/ChrisMalabanan/Techno40Pro", label: "Source" }
                ]
            },
            {
                title: "Thailand",
                backgroundImage: "https://raw.githubusercontent.com/chrismalabanan/Thailand/main/thailand.jpg",
                description: "Discover Thailand—a traveler’s dream where rich culture, pristine beaches, and modern amenities come together seamlessly.",
                links: [
                    { href: "https://chrismalabanan.github.io/Thailand/", label: "View" },
                    { href: "https://github.com/ChrisMalabanan/Thailand", label: "Source" }
                ]
            },
            {
                title: "Tensura Characters-Gallery",
                backgroundImage: "https://raw.githubusercontent.com/chrismalabanan/Tensura-Characters-Gallery/main/images/hero.jpg",
                description: "Characters-Gallery. It features various characters from the popular anime series \"That Time I Got Reincarnated as a Slime\" (Tensura).",
                links: [
                    { href: "https://chrismalabanan.github.io/Tensura-Characters-Gallery/", label: "View" },
                    { href: "https://github.com/chrismalabanan/Tensura-Characters-Gallery", label: "Source" }
                ]
            },
            {
                title: "Demon Slayer Characters-Gallery",
                backgroundImage: "https://raw.githubusercontent.com/ChrisMalabanan/Demon-Slayer-Gallery/main/images/door.jpg",
                description: "Demon Slayer Characters-Gallery. A visually stunning collection showcasing main and supporting characters from the hit anime \"Demon Slayer: Kimetsu no Yaiba,\" featuring high-quality artwork, vibrant colors, and detailed character designs that bring the story to life.",
                links: [
                    { href: "https://chrismalabanan.github.io/Demon-Slayer-Gallery/", label: "View" },
                    { href: "https://github.com/ChrisMalabanan/Demon-Slayer-Gallery", label: "Source" }
                ]
            }
        ];

        const worksGrid = document.getElementById("worksGrid");

        works.forEach(work => {
            const col = document.createElement("div");
            col.className = "col";

            const card = document.createElement("div");
            card.className = "work-card rounded-4 shadow-lg overflow-hidden position-relative";
            card.style.backgroundImage = `url('${work.backgroundImage}')`;
            card.style.height = "380px";
            card.style.backgroundSize = "cover";
            card.style.backgroundPosition = "center";

            card.innerHTML = `
                <div class="blur-layer"></div>
                <div class="position-absolute top-0 start-0 p-4">
                    <h5 class="card-title bg-dark bg-opacity-75 px-4 py-2 rounded fw-bold">
                        ${work.title}
                    </h5>
                </div>
                <div class="description-overlay position-absolute start-0 end-0 bottom-0 p-4">
                    <p class="card-text mb-3">
                        <i>${work.description}</i>
                    </p>
                    ${work.links.map(link => `
                        <a href="${link.href}" target="_blank" class="btn btn-outline-light btn-sm me-2">
                            ${link.label}
                        </a>
                    `).join("")}
                </div>
            `;

            col.appendChild(card);
            worksGrid.appendChild(col);
        });
    </script>
</body>

</html>
